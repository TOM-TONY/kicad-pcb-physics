[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-pcb-physics"
version = "0.1.0"
description = "Local copper, field, thermal and power-distribution analysis of filled circuit boards"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "shapely>=2.1", "pyamg>=5.1"]

[project.scripts]
pcb-physics = "kicad_pcb_physics.cli:main"
pcb-calibrate = "kicad_pcb_physics.calibration:main"

[tool.setuptools.package-data]
kicad_pcb_physics = ["viewer.html"]
